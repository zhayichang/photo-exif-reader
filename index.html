<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d0c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="读取并可视化展示照片的 EXIF、XMP、IPTC 和色彩配置等元数据。"
    />
    <title>EXIF 信息读取工具</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111614'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23d9ff68' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d9ff68'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="EXIF 信息读取工具首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>EXIF 信息读取工具</span>
      </a>
    </header>

    <main>
      <section class="upload-section" aria-labelledby="upload-title">
        <div class="intro-copy">
          <p class="eyebrow">PHOTO METADATA INSPECTOR</p>
          <h1 id="upload-title">看见照片背后的数据</h1>
          <p>
            读取 EXIF、XMP、IPTC 与色彩配置。支持 JPEG、TIFF、PNG、HEIC、AVIF 等常见成品图片格式。
          </p>
        </div>

        <label class="drop-zone" id="drop-zone" for="file-input">
          <input
            id="file-input"
            type="file"
            accept="image/jpeg,image/tiff,image/png,image/heic,image/heif,image/avif,.jpg,.jpeg,.tif,.tiff,.heic,.heif,.avif"
          />
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
            </svg>
          </span>
          <span class="drop-primary">拖入照片，或点击选择</span>
          <span class="drop-secondary">单个文件 · 不支持 RAW</span>
        </label>
        <div class="status-message" id="status" role="status" aria-live="polite"></div>
      </section>

      <section id="results" class="results" hidden aria-label="照片元数据结果">
        <div class="file-strip">
          <div class="preview-shell" id="preview-shell">
            <img id="preview" alt="所选照片预览" />
            <span id="preview-fallback">PHOTO</span>
          </div>
          <div class="file-heading">
            <p class="eyebrow">当前文件</p>
            <h2 id="file-name"></h2>
            <p id="file-meta"></p>
          </div>
          <button class="secondary-button" id="choose-another" type="button">选择另一张</button>
        </div>

        <section class="section-block" aria-labelledby="core-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">拍摄概览</p>
              <h2 id="core-title">核心信息</h2>
            </div>
            <p id="tag-total" class="section-stat"></p>
          </div>
          <div class="overview-grid">
            <article class="identity-card">
              <span class="card-label">相机与镜头</span>
              <strong id="camera-model">—</strong>
              <p id="lens-model">—</p>
              <dl class="identity-details">
                <div><dt>拍摄时间</dt><dd id="capture-time">—</dd></div>
                <div><dt>图像尺寸</dt><dd id="image-size">—</dd></div>
              </dl>
            </article>
            <div class="exposure-grid" aria-label="曝光三要素">
              <article class="exposure-card aperture">
                <span>光圈</span><strong id="aperture">—</strong><small>APERTURE</small>
              </article>
              <article class="exposure-card shutter">
                <span>快门</span><strong id="shutter">—</strong><small>SHUTTER</small>
              </article>
              <article class="exposure-card iso">
                <span>感光度</span><strong id="iso">—</strong><small>ISO</small>
              </article>
            </div>
          </div>
        </section>

        <section class="dashboard-grid">
          <article class="panel" aria-labelledby="privacy-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">发布前检查</p>
                <h2 id="privacy-title">隐私提示</h2>
              </div>
              <span class="privacy-score" id="privacy-score"></span>
            </div>
            <div id="privacy-list" class="privacy-list"></div>
          </article>

          <article class="panel" aria-labelledby="groups-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">信息构成</p>
                <h2 id="groups-title">元数据分布</h2>
              </div>
            </div>
            <div id="group-chart" class="group-chart"></div>
          </article>
        </section>

        <section class="section-block details-section" aria-labelledby="details-title">
          <div class="section-heading details-heading">
            <div>
              <p class="eyebrow">完整记录</p>
              <h2 id="details-title">全部元数据</h2>
            </div>
            <div class="table-tools">
              <label class="search-field">
                <span class="sr-only">搜索标签或数值</span>
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                  <circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path>
                </svg>
                <input id="search" type="search" placeholder="搜索标签或数值" />
              </label>
              <label class="group-select">
                <span class="sr-only">按元数据分组筛选</span>
                <select id="group-filter"><option value="">全部分组</option></select>
              </label>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>分组</th><th>标签</th><th>值</th></tr></thead>
              <tbody id="metadata-body"></tbody>
            </table>
            <div id="empty-filter" class="empty-filter" hidden>没有匹配的元数据。</div>
          </div>
        </section>
      </section>
    </main>

    <footer>
      <span id="engine">由 exifr 7.1.3 提供元数据解析</span>
    </footer>

    <script src="./vendor/exifr.full.umd.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
